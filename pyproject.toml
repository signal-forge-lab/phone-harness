[project]
name = "phone-harness"
version = "0.1.0"
description = "Control a real iPhone from macOS or Windows with OCR eyes and native device input"
requires-python = ">=3.10"
dependencies = [
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
    "pyobjc-framework-AppKit; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "Pillow>=10; sys_platform == 'win32'",
]

[project.scripts]
phone-harness = "phone_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phone_harness"]
